name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black Formatter Check
        run: |
          black --check --diff .

      - name: Run isort Import Order Check
        run: |
          isort --check-only --diff .

      - name: Run Flake8 Linter
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  terraform-checks:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: |
          terraform -chdir=deploy/terraform fmt -check

      - name: Terraform Init (Backend-less)
        run: |
          terraform -chdir=deploy/terraform init -backend=false

      - name: Terraform Validate
        run: |
          terraform -chdir=deploy/terraform validate

  test-and-validate:
    name: Unit Tests & Exercise Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Generate Synthetic Cohort
        run: |
          python samples/generate_synthetic_data.py

      - name: Run Exercises Offline Validation Suite
        run: |
          python scripts/validate_exercises.py --local-mode
